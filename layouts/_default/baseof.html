<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <style>
    body {
      margin: 40px auto;
      max-width: 650px;
      line-height: 1.6;
      font-size: 18px;
      color: #444;
      padding: 0 10px;
    }
    h1, h2, h3 {
      line-height: 1.2;
    }
    h1 a {
      color: inherit;
      text-decoration: none;
    }
    nav a + a {
      margin-left: 0.75em;
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ "/" | relURL }}">Terracotta</a></h1>
    <nav>
      <a href="{{ "/golem/" | relURL }}">Golem</a>
      <a href="{{ "/about/" | relURL }}">About</a>
      <a href="https://github.com/terracotta4u">GitHub</a>
    </nav>
  </header>
  {{ block "main" . }}{{ end }}
  <footer>
    <hr>
    <p>&copy; {{ now.Year }} Terracotta</p>
  </footer>
</body>
</html>
