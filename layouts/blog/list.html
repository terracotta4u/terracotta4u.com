{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ with .RegularPages.ByDate.Reverse }}
    {{ range . }}
      <article>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p>{{ .Date.Format "January 2, 2006" }}</p>
        {{ with .Params.blurb }}
          <p>{{ . }}</p>
        {{ end }}
      </article>
    {{ end }}
  {{ else }}
    <p>No posts yet.</p>
  {{ end }}
{{ end }}
