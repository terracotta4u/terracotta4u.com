{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>
    <p>{{ .Date.Format "January 2, 2006" }}</p>
    {{ .Content }}
    {{ with .Params.tags }}
      <p class="tags">
        {{ range . }}
          <a href="{{ printf "/tags/%s/" (. | urlize) | relURL }}">{{ . }}</a>
        {{ end }}
      </p>
    {{ end }}
  </article>
{{ end }}
